<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pengembangan Aplikasi Web Tugas 3</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav>
            <img src="images/Logo_ITERA.png" alt="Logo">
            <header>
                <ul>
                    <li><a href="index.html">Daftar Tiket</a></li>
                    <li><a href="data.html">Data Tiket</a></li>
                </ul>
            </header>
        </nav>

        <main>
            <section class="box">
                <h1>Pembuatan Tiket Helpdesk ITERA</h1>

                <form action="data.html" method="get">
                    <legend>Daftar Tiket</legend>
                    <div>
                        <label for="nama">Nama:</label>
                        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required><br><br>
                    </div>

                    <div>
                        <label for="nim">NIM:</label>
                        <input type="text" id="nim" name="nim" pattern="[0-9]{9}" placeholder="9 digit angka" required><br><br>
                    </div>

                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="nama@student.itera.ac.id" required><br><br>
                    </div>

                    <div>
                        <label for="Keperluan">Keperluan:</label>
                        <input type="text" id="Keperluan" name="Keperluan" placeholder="Contoh: Surat keterangan aktif" required><br><br>
                    </div>

                    <input type="submit" value="Simpan">
                </form>
            </section>
        </main>
        <footer>
            <p>&copy; 2026 Erza Farandi</p>
        </footer>
    </body>
</html>
