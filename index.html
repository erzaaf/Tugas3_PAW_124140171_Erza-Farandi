<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pengembangan Aplikasi Web Tugas 3</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav>
            <img src="images/Logo_ITERA.png" alt="Logo">
            <header>
                <ul>
                    <li><a href="index.html">Daftar Tiket</a></li>
                    <li><a href="data.html">Data Tiket</a></li>
                </ul>
            </header>
        </nav>

        <main>
            <section id="Daftar Tiket">

                <legend>Form Pendaftaran</legend>
                <form action="data.html" method="get">
                    <label for="nama">Nama:</label>
                    <input type="text" id="nama" name="nama" required><br><br>

                    <label for="nim">NIM:</label>
                    <input type="text" id="nim" name="nim" required><br><br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required><br><br>

                    <label for="Keperluan">Keperluan:</label>
                    <input type="text" id="Keperluan" name="Keperluan" required><br><br>

                    <input type="submit" value="Simpan">
                </form>
            </section>

        <footer style="padding: 16px; text-align: center; color: white; background: red; position: fixed; bottom: 0; left: 0; right: 0;">
            <p style="margin: 0;">&copy; 2026 Erza Farandi</p>
        </footer>
    </body>
</html>
